name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ─── Transcribe drift: the committed *.sdl.yaml transcriptions are
  #     derived from the *.graphml figure sources by packet-net/ax25sdl's
  #     Packet.Sdl.Transcribe walker. Regenerate them with the tooling
  #     commit pinned in .github/ax25sdl-tooling-ref and fail if the
  #     committed yaml has drifted from the figures in THIS repo.
  #     (Backend codegen drift — yaml → C#/Go/TS/Rust/C/Python/JSON — is
  #     packet-net/ax25sdl's CI's job, not ours.)
  #     This repo has no self-hosted runners; jobs here MUST use
  #     GitHub-hosted runners (ubuntu-latest).
  transcribe-drift:
    name: transcribe drift — graphml → yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: read ax25sdl tooling pin
        id: pin
        run: echo "ref=$(cat .github/ax25sdl-tooling-ref)" >> "$GITHUB_OUTPUT"
      - name: check out pinned ax25sdl tooling
        uses: actions/checkout@v6
        with:
          repository: packet-net/ax25sdl
          ref: ${{ steps.pin.outputs.ref }}
          path: .ax25sdl-tooling
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: .ax25sdl-tooling/global.json
      - name: build the transcriber
        run: dotnet build .ax25sdl-tooling/codegen/src/Packet.Sdl.Transcribe --configuration Release
      - name: regenerate yaml from graphml, every machine
        # Every spec-sdl/<revision>/<machine>/sdl/ directory is regenerated
        # into its sibling yaml/ directory, so a new machine is covered as
        # soon as its first graphml lands. A machine with no sdl/ directory
        # (the prose-derived management-data-link bootstrap) has nothing to
        # regenerate. The transcriber itself fails the step on a graphml in
        # another machine's directory, on two graphmls writing one yaml, on
        # an orphan *.sdl.yaml with no graphml, and on any page or
        # subroutine it cannot walk.
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(spec-sdl/*/*/sdl)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::no spec-sdl/<revision>/<machine>/sdl/ directories found"
            exit 1
          fi
          for sdl in "${dirs[@]}"; do
            yaml="$(dirname "$sdl")/yaml"
            echo "$sdl -> $yaml"
            dotnet run --no-build --project .ax25sdl-tooling/codegen/src/Packet.Sdl.Transcribe --configuration Release -- \
              -i "$sdl/" -o "$yaml/"
          done
      - name: assert no diff
        # git status rather than git diff, so a yaml that should exist but
        # was never committed (untracked after regeneration) also fails.
        run: |
          changes="$(git status --porcelain -- 'spec-sdl/*/yaml/*.sdl.yaml')"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- 'spec-sdl/*/yaml/*.sdl.yaml'
            echo "::error::*.sdl.yaml files are out of sync with their *.graphml sources. From a packet-net/ax25sdl checkout at the ref in .github/ax25sdl-tooling-ref, run \`dotnet run --project codegen/src/Packet.Sdl.Transcribe -- -i <this-repo>/spec-sdl/<revision>/<machine>/sdl/ -o <this-repo>/spec-sdl/<revision>/<machine>/yaml/\` for each machine and commit the result."
            exit 1
          fi

  # ─── Schema: every committed *.sdl.yaml validates against
  #     spec-sdl/schema/ (sdl-machine for state pages, sdl-subroutines for
  #     subroutines pages).
  schema:
    name: schema, sdl.yaml against spec-sdl/schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: install validator dependencies
        # A venv, because the runner's system Python refuses pip installs
        # (PEP 668).
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet jsonschema pyyaml
      - name: validate
        run: '"$RUNNER_TEMP/venv/bin/python" tools/schema/validate_sdl_yaml.py .'

  # ─── Render drift: the committed SVG renders in spec-sdl/**/svg/ are
  #     generated from the graphml by tools/render/render_all.py (Python
  #     stdlib only). Keeping them locked means every figure PR carries a
  #     reviewable visual diff (GitHub shows rich image diffs for SVGs).
  #     Only sound from this branch on: render_graphml_svg.py's resource
  #     cache is now keyed by content, not id(), so output is
  #     deterministic. Note the pathspec ends in '*' — a bare
  #     'spec-sdl/**/svg/' pathspec matches nothing and the check would
  #     be vacuous.
  render-drift:
    name: render drift — graphml → SVG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: regenerate SVG renders
        run: python3 tools/render/render_all.py
      - name: assert no diff
        run: |
          if ! git diff --exit-code -- 'spec-sdl/**/svg/*'; then
            echo "::error::Committed SVG renders are out of sync with the graphml sources. Run \`python3 tools/render/render_all.py\` locally and commit the diff."
            exit 1
          fi
