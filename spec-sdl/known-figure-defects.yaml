# Known figure defects: transitions that lead to a state which does not
# exist, because the figure draws them that way. The transcription records
# what is drawn; each entry here says the defect is known and filed.
#
# Read by packet-net/ax25sdl's codegen (run in this repo's CI by the
# codegen-lint job). A listed defect is reported as a warning, and its
# machine is withheld from generation while the entry is present. An entry
# whose defect no longer occurs fails CI, so this list can't go stale: when
# a figure is fixed, remove its entry in the same PR.
#
# Three kinds. unknown_next_state (the default): machine and state of the
# page, the generated transition id, the next: value the figure draws, and
# the issue; its machine is withheld from generation. missing_catchall:
# machine, state and issue only, for a state whose figure draws no
# catch-all input; the machine still generates, with partial coverage.
# unknown_subroutine: machine, page (the Annex C page key), the call exactly
# as drawn, and the issue, for a subroutine call naming no subroutine of its
# machine; one entry per page that draws it. The last two
# change nothing generated, so they are the only kinds a published machine
# may carry.

defects:
  - machine: link_mux
    state: SiezePending
    transition: t07_ph_seize_confirm
    next: Sized
    issue: https://github.com/packethacking/ax25spec/issues/121
    note: Figure C3.2's PH-SIEZE Confirm column ends in "2 Sized"; the state is 2 Seized.

  - kind: missing_catchall
    machine: management_data_link
    state: Ready
    issue: https://github.com/packethacking/ax25spec/issues/133
    note: Figure C5.1 draws no "All Other Primitives" column.

  - kind: missing_catchall
    machine: management_data_link
    state: Negotiating
    issue: https://github.com/packethacking/ax25spec/issues/133
    note: Figure C5.2 draws no "All Other Primitives" column.

  # Data Link calls drawn under names Figure C4.7 doesn't use (N(r) Error
  # Recovery, Select T1, Transmit Enquiry, Check I Frame Acknowledged).
  - kind: unknown_subroutine
    machine: data_link
    page: AwaitingConnection
    call: "Select T1 Value"
    issue: https://github.com/packethacking/ax25spec/issues/144
  - kind: unknown_subroutine
    machine: data_link
    page: AwaitingRelease
    call: "Select T1 Value"
    issue: https://github.com/packethacking/ax25spec/issues/144
  - kind: unknown_subroutine
    machine: data_link
    page: AwaitingV22Connection
    call: "Select T1 Value"
    issue: https://github.com/packethacking/ax25spec/issues/144
  - kind: unknown_subroutine
    machine: data_link
    page: Connected
    call: "Select T1 Value"
    issue: https://github.com/packethacking/ax25spec/issues/144
  - kind: unknown_subroutine
    machine: data_link
    page: Connected
    call: "Transmit Enquery"
    issue: https://github.com/packethacking/ax25spec/issues/144
  - kind: unknown_subroutine
    machine: data_link
    page: Connected
    call: "Check I Frames Acknowledged"
    issue: https://github.com/packethacking/ax25spec/issues/144
  - kind: unknown_subroutine
    machine: data_link
    page: TimerRecovery
    call: "Select T1 Value"
    issue: https://github.com/packethacking/ax25spec/issues/144
  - kind: unknown_subroutine
    machine: data_link
    page: TimerRecovery
    call: "N(r) Recovery"
    issue: https://github.com/packethacking/ax25spec/issues/144
  - kind: unknown_subroutine
    machine: data_link
    page: TimerRecovery
    call: "Check I Frames Acknowledged"
    issue: https://github.com/packethacking/ax25spec/issues/144
  - kind: unknown_subroutine
    machine: data_link
    page: Subroutines
    call: "Select T1 Value"
    issue: https://github.com/packethacking/ax25spec/issues/144

  # Management Data Link calls on C5.1 and C5.2 whose names don't match
  # the C5.3 to C5.7 subroutine pages (COP, OF, Notification).
  - kind: unknown_subroutine
    machine: management_data_link
