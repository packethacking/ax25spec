    page: Ready
    call: "Retry Negotiation Response"
    issue: https://github.com/packethacking/ax25spec/issues/131
  - kind: unknown_subroutine
    machine: management_data_link
    page: Negotiating
    call: "Complete Classes of Procedures Negotiation"
    issue: https://github.com/packethacking/ax25spec/issues/131
  - kind: unknown_subroutine
    machine: management_data_link
    page: Negotiating
    call: "Complete Optional Functions Negotiation"
    issue: https://github.com/packethacking/ax25spec/issues/131
  - kind: unknown_subroutine
    machine: management_data_link
