  - kind: unknown_subroutine
    machine: management_data_link
    page: Negotiating
    call: "Complete Retry Negotiation"
    issue: https://github.com/packethacking/ax25spec/issues/131

  # Figure C6.1 (Segmenter Ready) leads to two Reassembler states.
  - machine: segmenter
    state: Ready
    transition: t01_dl_data_request_yes_no
    next: ReassemblingData
    issue: https://github.com/packethacking/ax25spec/issues/135
    note: C6.1's DL-DATA Request column ends in "1 Reassembling Data", a Reassembler state.
  - machine: segmenter
    state: Ready
    transition: t02_dl_unit_data_request_yes_no
    next: ReassemblingUnitData
    issue: https://github.com/packethacking/ax25spec/issues/135
    note: C6.1's DL-UNIT-DATA Request column ends in "1 Reassembling Unit Data", a Reassembler state.

  # Figure C2b.2 (Duplex Physical Receiving) draws no catch-all input.
  - kind: missing_catchall
    machine: duplex_phy
    state: Receiving
    issue: https://github.com/packethacking/ax25spec/issues/143
    note: C2b.2 draws only HW-DATA Indication and HW-LOS Indication.

  # Figure C2a.1 (Simplex Physical Ready) calls "Acuisition"; the
  # subroutines page (C2a.s) names it "Acquisition".
  - kind: unknown_subroutine
    machine: simplex_phy
    call: "Acuisition"
    issue: https://github.com/packethacking/ax25spec/issues/148
