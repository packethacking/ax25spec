# Canonical AX.25 event catalog. Every transition's `on:` field in a
# *.sdl.yaml MUST appear in one of the groups below. The codegen tool will
# refuse to emit code for an event it can't find here.
#
# Source: AX.25 v2.2 rev 4 (Oct 2025) §5 (primitives) and §C (SDL).

# Service primitives from the upper layer (Layer 3 → Data-Link).
primitives_upper:
  - DL_DATA_request
  - DL_UNIT_DATA_request
  - DL_CONNECT_request
  - DL_DISCONNECT_request
  - DL_FLOW_OFF_request
  - DL_FLOW_ON_request

# Service primitives from Data-Link up to the Reassembler (Annex C6),
# drawn as receptions from the lower layer on figc6.2 to figc6.4.
primitives_from_data_link:
  - DL_DATA_indication          # figc6.2, figc6.3 "DL-DATA Indication"
  - DL_UNIT_DATA_indication     # figc6.2, figc6.4 "DL-UNIT-DATA Indication"

# Service primitives between Data-Link and Management Data-Link.
primitives_mgmt:
  - MDL_NEGOTIATE_request
  - MDL_NEGOTIATE_confirm
  - MDL_ERROR_indicate

# Frames received from the link (decoded from the lower layer).
frames_received:
  - I_received
  - RR_received
  - RNR_received
  - REJ_received
  - SREJ_received
  - UI_received
  - SABM_received
  - SABME_received
  - DISC_received
  - UA_received
  - DM_received
  - FRMR_received
  - XID_received
  # Management-Data-Link negotiation distinguishes the XID *command*
  # from the XID *response* (figc5.1 and figc5.2 draw both as inputs).
  # `XID_received` above is the undifferentiated data-link spelling
  # (not yet used by any data-link page).
  - XID_command_received        # figc5.1, figc5.2 "XID Command"
  - XID_response_received       # figc5.1, figc5.2 "XID Response"
  - FRMR_response_received      # figc5.2 "FRMR Response"
  - TEST_received
  # Composite event: figc4.3 (AwaitingRelease) groups all info/supervisory
  # command frames into a single SDL input column labelled
  # "I, RR, RNR, REJ or SREJ Commands". Lossless encoding preserves the
  # figure's grouping rather than fanning out across the five individual
  # frame events above.
  - i_or_s_command_received

# Catch-all "everything not matched above" events. The double-underscore
# suffix records which shape-class (figc1.1 / d5 description) the catch-all
# was drawn with, since the same label can appear in a figure with two
# different shape sources (figc4.1's Disconnected state is the worked
# example: two "All Other Primitives" columns, one per source).
catchalls:
  - all_other_primitives__from_lower_layer
  - all_other_primitives__from_upper_layer
  - all_other_commands
  # Segmenter and Reassembler (Annex C6) draw "All Other DL Primitives":
  # from the upper layer on figc6.1, from the lower layer on figc6.2 to
  # figc6.4.
  - all_other_dl_primitives__from_upper_layer   # figc6.1 "All Other DL Primitives"
  - all_other_dl_primitives__from_lower_layer   # figc6.2 to figc6.4 "All Other DL Primitives"

# Internal events (queue / timer).
internal:
  - I_frame_pops_off_queue
  - control_field_error
  - info_not_permitted_in_frame
  - info_field_permitted_in_frame
  - u_or_s_frame_length_error
  # Link Multiplexer, figc3.1 (Idle) "Queue Empty", drawn as an Internal
  # Signal Reception. The figure does not say which queue; the C3.3 prose
  # describes the Awaiting Queue running empty.
  - queue_empty
  # Link Multiplexer, figc3.2 (Sieze Pending) and figc3.3 (Seized)
  # "Current Queue Empty", also an Internal Signal Reception.
  - current_queue_empty

# Service primitives between Data-Link and Link Multiplexer. Named
# <PREFIX>_<NAME>_<kind> like every primitive family. figc3.1 and figc3.2
# draw SIEZE; the transcriber maps it to the prose and Data Link spelling
# SEIZE (packethacking/ax25spec#61), so each primitive has one id on every
# machine. on_label keeps the figure's spelling.
link_multiplexer:
  - LM_SEIZE_confirm
  - LM_RELEASE_request          # figc3.1 "LM-RELEASE Request"
  - LM_DATA_request             # figc3.1 "LM-DATA Request"
  - LM_EXPEDITED_DATA_request   # figc3.1 "LM-EXPEDITED-DATA Request"
  - LM_SEIZE_request            # figc3.1 "LM-SIEZE Request" (#61)

# Service primitives between the Link Multiplexer and the physical layer
# (Appendix C3.2). Same convention, and the same SIEZE to SEIZE mapping.
primitives_physical:
  - PH_SEIZE_confirm            # figc3.1 "PH-SIEZE Confirm" (#61)
  - PH_DATA_indication          # figc3.1 "PH-DATA Indication"
  - PH_BUSY_indication          # figc3.1 "PH-BUSY Indication"
  - PH_QUIET_indication         # figc3.1 "PH-QUIET Indication"

# Timer expiries.
timers:
  - T1_expiry
  - T2_expiry
  - T3_expiry
  # TM201 — retry timer for management functions (Appendix C5.3
  # "Timers"). Drives the Management-Data-Link Negotiating state's XID
  # command retransmit / give-up logic.
  - TM201_expiry
  # TR210, the Reassembler's reassembly timer (figc6.3 and figc6.4
  # "TR210 Expiry", drawn as a reception from the lower layer).
  - TR210_expiry
